<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>touch probe</title>
<style>
  /* TEMPORARY diagnostic page — not linked from anywhere. Delete before merging. */
  html,body{margin:0;font:13px -apple-system,sans-serif}
  #log{position:fixed;left:0;right:0;top:0;height:150px;overflow:auto;background:#111;color:#0f0;
       font:11px ui-monospace,monospace;padding:6px;z-index:99;white-space:pre-wrap}
  main{padding:158px 8px 40px}
  .case{margin-bottom:14px;border:1px solid #ccc;border-radius:8px;overflow:hidden}
  .case h2{margin:0;padding:6px 8px;font-size:12px;background:#eee}
  .stage{position:relative;height:110px;background:#fff}
  .stage canvas{display:block}

  /* Case A: exactly how src/styles.css draws the pdf.js text layer today */
  .textLayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;opacity:1;line-height:1;z-index:2}
  .textLayer > span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
  .textLayer ::selection{background:rgba(37,99,235,.28)}

  /* Case B: same, plus an explicit selection opt-in */
  #b .textLayer{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  #b .textLayer > span{-webkit-user-select:text;user-select:text}
  #b canvas{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;pointer-events:none}

  /* Case C: control — ordinary visible text, no canvas */
  #c .stage{padding:8px}
</style>
</head>
<body>
<div id="log">long-press each block. log:\n</div>
<main>
  <div class="case" id="a"><h2>A — current textLayer (transparent span over canvas)</h2>
    <div class="stage"><canvas width="700" height="220" style="width:100%;height:110px"></canvas>
      <div class="textLayer"></div></div></div>

  <div class="case" id="b"><h2>B — + user-select:text, canvas not draggable</h2>
    <div class="stage"><canvas width="700" height="220" style="width:100%;height:110px"></canvas>
      <div class="textLayer"></div></div></div>

  <div class="case" id="c"><h2>C — control: plain visible text</h2>
    <div class="stage">The quick brown fox jumps over the lazy dog. Long-press a word here.</div></div>
</main>
<script>
const logEl = document.getElementById('log');
let lines = [];
function log(s){ lines.unshift(s); lines = lines.slice(0,12); logEl.textContent = lines.join('\n'); }

// paint some text into the canvas + lay transparent spans on top, like pdf.js does
for (const id of ['a','b']) {
  const st = document.querySelector('#'+id+' .stage');
  const cv = st.querySelector('canvas'), ctx = cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,700,220);
  ctx.fillStyle='#111'; ctx.font='32px Georgia';
  ctx.fillText('Background sequential computation', 12, 60);
  ctx.fillText('attention mechanism transformer', 12, 130);
  const tl = st.querySelector('.textLayer');
  [['Background sequential computation',12,18],['attention mechanism transformer',12,53]].forEach(([t,x,y])=>{
    const s=document.createElement('span');
    s.textContent=t; s.style.left=x/2+'px'; s.style.top=y+'px'; s.style.fontSize='16px';
    tl.appendChild(s);
  });
}

document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const cs = el ? getComputedStyle(el) : null;
  log('touchstart hit=' + (el ? el.tagName + (el.className? '.'+el.className : '') : 'null')
      + ' us=' + (cs? cs.webkitUserSelect || cs.userSelect : '?'));
}, {passive:true});
document.addEventListener('touchend', () => log('touchend  sel="' + String(getSelection()).slice(0,28) + '"'), {passive:true});
document.addEventListener('mouseup',  () => log('mouseup   sel="' + String(getSelection()).slice(0,28) + '"'));
document.addEventListener('selectionchange', () => log('selchange sel="' + String(getSelection()).slice(0,28) + '"'));
document.addEventListener('dragstart', e => log('DRAGSTART on ' + e.target.tagName));
</script>
</body>
</html>
