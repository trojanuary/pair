<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PairedX — Source-Linked AI Reading Workspace</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preload" href="/assets/fonts/PublicSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/SourceSerif4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ds.css">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<!-- Refraction map for the glass panels and source pins. Chrome takes it via
     backdrop-filter:url(); other engines fall back to a plain frost. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="lg-distort" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="2" seed="7" result="noise"></feTurbulence>
    <feGaussianBlur in="noise" stdDeviation="1.1" result="softNoise"></feGaussianBlur>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
  <!-- Same idea as #lg-distort but a much smaller displacement, for the source
       pins: they sit directly on body text, where the panel-strength warp
       smears the words underneath into mush. -->
  <filter id="lg-distort-pin" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.03" numOctaves="2" seed="7" result="noise"></feTurbulence>
    <feGaussianBlur in="noise" stdDeviation="1.4" result="softNoise"></feGaussianBlur>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
  <filter id="lg-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.2"></feGaussianBlur>
  </filter>
</svg>
<div id="app">

  <!-- ===== Left library ===== -->
  <aside id="sidebar">
    <div class="sb-top">
      <div class="brand">Px</div>
      <div class="wordmark">Paired<b>X</b></div>
      <button class="icon-btn collapse-tog" id="btnCollapseLeft" title="Collapse library"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 6l-5 6 5 6M18.5 6l-5 6 5 6"/></svg></button>
    </div>
    <button class="new-btn" id="newBtn" title="Open a PDF, notes (.json), or a shared paper (.html)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v1"/><path d="M3 8h18l-1.6 9.3a1 1 0 0 1-1 .7H5.6a1 1 0 0 1-1-.7z"/></svg> Open PDF or bundle</button>
    <input type="file" id="fileInput" accept="application/pdf,.json,application/json,.html,text/html" multiple class="hidden">
    <button class="side-btn" id="btnShareHtml" title="Save this paper + notes as one self-contained .html you can share"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l6 6v14H6z"/><path d="M14 2v6h6"/><rect x="3.3" y="12.4" width="17.4" height="7.2" rx="1.5" fill="currentColor" stroke="none"/><text x="12" y="17.9" font-size="4.6" font-weight="700" letter-spacing="0.3" text-anchor="middle" fill="#fff" stroke="none" font-family="Arial,Helvetica,sans-serif">HTML</text></svg> Share as HTML</button>
    <div class="sb-scroll">
    <nav class="nav">
      <div class="nav-item" data-view="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span> Home</div>
      <div class="nav-item" data-view="recents"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span> Recents</div>
      <div class="nav-item" data-view="starred"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.6 6.6 20.4l1-6.1L3.2 10l6.1-.9z"/></svg></span> Starred</div>
      <div class="nav-item" data-view="trash"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span> Trash</div>
    </nav>
    <div class="sb-sec"><span style="display:inline-flex;align-items:center;gap:7px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5h7l2 2h9v12H3z"/></svg> <span id="libSecLabel">My Library</span></span></div>
    <div class="tree">
      <div id="docList"></div>
    </div>
    </div>
    <div class="sb-storage">
      <div style="display:flex;align-items:center;justify-content:space-between"><span>Storage</span><button class="icon-btn" id="btnSettings" title="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <div class="bar"><i id="storageBar" style="width:4%"></i></div>
      <div id="storageText">Calculating…</div>
    </div>
  </aside>

  <!-- ===== Center reader ===== -->
  <section id="reader">
    <div class="rd-top">
      <button class="icon-btn" id="btnToggleLeft" title="Show library"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      <!-- everything between the two panel toggles; scrolls on its own when the screen is narrow -->
      <div class="rd-mid">
      <div class="rd-group pagebox">
        <button class="icon-btn" id="pagePrev">‹</button>
        <input class="pagein" id="pageInput" value="1">
        <span class="pagetotal" id="pageTotal">/ 1</span>
        <button class="icon-btn" id="pageNext">›</button>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="zoomOut">−</button>
        <span id="zoomVal">115%</span>
        <button class="icon-btn" id="zoomIn">+</button>
      </div>
      <div class="tools">
        <button class="tool" id="toolCursor" title="Select"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l15 8-6 2-2 6z"/></svg></button>
        <button class="tool" id="toolHi" title="Highlight"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 16l8-8 4 4-8 8H6z"/></svg></button>
        <button class="tool" id="toolComment" title="Comment"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.3 7.3L4 20l.7-5.7A8 8 0 1 1 21 12z"/></svg></button>
        <button class="tool" id="toolShot" title="Screenshot region"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
      </div>
      <button class="icon-btn" id="btnContinuous" title="Continuous scroll"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="3" width="14" height="7" rx="1.5"/><rect x="5" y="14" width="14" height="7" rx="1.5"/></svg></button>
      <button class="icon-btn" id="btnSearch" title="Search in document"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
      <button class="icon-btn" id="btnExportTop" title="Export annotations">⋯</button>
      </div>
      <button class="icon-btn" id="btnToggleRight" title="Show notes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
    </div>
    <div class="rd-scroll" id="rdScroll">
      <div class="page-wrap" id="pageWrap">
        <canvas id="pageCanvas"></canvas>
        <div class="textLayer" id="textLayer"></div>
        <div class="overlay" id="overlay"></div>
        <div class="overlay" id="pins"></div>
        <div id="captureMask"></div>
      </div>
      <div class="capbar hidden" id="capBar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9V4h5M21 9V4h-5M3 15v5h5M21 15v5h-5"/></svg>
        Select area to capture <span class="x" id="capCancel">Cancel</span>
      </div>
    </div>
  </section>

  <!-- ===== Right notes ===== -->
  <aside id="notes">
    <div class="nt-top">
      <h2>Notes</h2>
      <div class="nt-tophdr">
        <button class="icon-btn" id="btnFilter" title="Filter & options"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.3 7.4V19l-3.4-1.7v-4.9z"/></svg></button>
        <button class="icon-btn" id="btnNotesSearch" title="Search notes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M4 11h5M4 16h4"/><circle cx="16.5" cy="15.5" r="3.5"/><path d="M22 21l-3-3"/></svg></button>
        <button class="icon-btn" id="btnNotesMenu" title="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
        <button class="icon-btn collapse-tog" id="btnCollapseRight" title="Collapse notes"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 6l5 6-5 6M5.5 6l5 6-5 6"/></svg></button>
      </div>
    </div>
    <div class="nt-searchbar hidden" id="ntSearchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="notesSearchInput" placeholder="Search notes, answers, tags…" autocomplete="off">
    </div>
    <div class="nt-list" id="notesList"></div>
    <div class="nt-foot">
      <span id="notesCount">0 notes</span><button id="sortSel">Sorted by time ▾</button>
    </div>
    <div class="composer" id="composer">
      <div class="ctx hidden" id="composerCtx"></div>
      <div class="cbox">
        <div class="men-box"><div class="men-hl" id="composerHL" aria-hidden="true"></div><textarea id="composerInput" class="men-input" rows="1" placeholder="Select text or a figure to start a note…"></textarea></div>
        <button class="send" id="composerSend"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
      </div>
    </div>
  </aside>
  <!-- dims the page behind an open drawer; only rendered at drawer widths -->
  <div id="scrim"></div>
</div>

<!-- selection popover -->
<div id="selPop" class="hidden" style="position:fixed;z-index:60;background:var(--ink-strong);color:#fff;border-radius:12px;box-shadow:0 20px 44px -18px rgba(28,34,32,.5);display:flex;gap:2px;padding:5px">
  <button id="spHi" style="color:#fff;padding:6px 10px;border-radius:8px;font-weight:600;font-size:12.5px">Highlight</button>
  <button id="spNote" style="color:#fff;padding:6px 10px;border-radius:8px;font-weight:600;font-size:12.5px">Note</button>
  <button id="spAsk" style="color:var(--teal-200);padding:6px 10px;border-radius:8px;font-weight:700;font-size:12.5px">✦ Ask AI</button>
</div>

<svg id="connectors"></svg>
<div id="toasts"></div>
<div id="modalRoot"></div>
<div id="exportRoot" class="hidden"></div>

<script src="/vendor/pdf.min.js"></script>
<script src="/vendor/pdf.worker.b64.js"></script>
<script src="/assets/sample-pdf.js"></script>
<script src="/assets/sample-notes.js"></script>
<script src="/src/app.js"></script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
