<div id="app">

  <!-- ===== Left library ===== -->
  <aside id="sidebar">
    <div class="sb-top">
      <div class="brand">Px</div>
      <div class="wordmark">Paired<b>X</b></div>
      <button class="icon-btn collapse-tog" id="btnCollapseLeft" title="Collapse library"><svg class="px-i" style="font-size:17px" aria-hidden="true"><use href="#i-caret-double-left"></use></svg></button>
    </div>
    <button class="new-btn" id="newBtn" title="Open a PDF, notes (.json), or a shared paper (.html)"><svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-plus"></use></svg> Open PDF or bundle</button>
    <input type="file" id="fileInput" accept="application/pdf,.json,application/json,.html,text/html" multiple class="hidden">
    <button class="side-btn" id="btnShareHtml" title="Save this paper + notes as one self-contained .html you can share"><svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-file-html"></use></svg> Share as HTML</button>
    <div class="sb-scroll">
    <nav class="nav">
      <div class="nav-item" data-view="home"><span class="ic"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-house"></use></svg></span> Home</div>
      <div class="nav-item" data-view="recents"><span class="ic"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-clock-counter-clockwise"></use></svg></span> Recents</div>
      <div class="nav-item" data-view="starred"><span class="ic"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-star"></use></svg></span> Starred</div>
      <div class="nav-item" data-view="trash"><span class="ic"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-trash"></use></svg></span> Trash</div>
    </nav>
    <div class="sb-sec"><span style="display:inline-flex;align-items:center;gap:7px"><svg class="px-i" style="font-size:15px" aria-hidden="true"><use href="#i-folder"></use></svg> <span id="libSecLabel">My Library</span></span></div>
    <div class="tree">
      <div id="docList"></div>
    </div>
    </div>
    <div class="sb-storage">
      <div style="display:flex;align-items:center;justify-content:space-between"><span>Storage</span><button class="icon-btn" id="btnSettings" title="Settings"><svg class="px-i" style="font-size:17px" aria-hidden="true"><use href="#i-gear-six"></use></svg></button></div>
      <div class="bar"><i id="storageBar" style="width:4%"></i></div>
      <div id="storageText">Calculating…</div>
    </div>
  </aside>

  <!-- ===== Center reader ===== -->
  <section id="reader">
    <div class="rd-top">
      <button class="icon-btn" id="btnToggleLeft" title="Show library"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-sidebar-simple"></use></svg></button>
      <!-- everything between the two panel toggles; scrolls on its own when the screen is narrow -->
      <div class="rd-mid">
      <div class="rd-group pagebox">
        <button class="icon-btn" id="pagePrev"><svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-caret-left"></use></svg></button>
        <input class="pagein" id="pageInput" value="1">
        <span class="pagetotal" id="pageTotal">/ 1</span>
        <button class="icon-btn" id="pageNext"><svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-caret-right"></use></svg></button>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="zoomOut"><svg class="px-i" style="font-size:14px" aria-hidden="true"><use href="#i-minus"></use></svg></button>
        <span id="zoomVal">115%</span>
        <button class="icon-btn" id="zoomIn"><svg class="px-i" style="font-size:14px" aria-hidden="true"><use href="#i-plus"></use></svg></button>
      </div>
      <div class="tools">
        <button class="tool" id="toolCursor" title="Select"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-cursor"></use></svg></button>
        <button class="tool" id="toolHi" title="Highlight"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-highlighter"></use></svg></button>
        <button class="tool" id="toolComment" title="Comment"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-chat-text"></use></svg></button>
        <button class="tool" id="toolShot" title="Screenshot region"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-camera"></use></svg></button>
      </div>
      <button class="icon-btn" id="btnContinuous" title="Continuous scroll"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-rows"></use></svg></button>
      <button class="icon-btn" id="btnSearch" title="Search in document"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg></button>
      <button class="icon-btn" id="btnExportTop" title="Export annotations"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-dots-three"></use></svg></button>
      </div>
      <button class="icon-btn" id="btnToggleRight" title="Show notes"><svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-frame-corners"></use></svg></button>
    </div>
    <div class="rd-scroll" id="rdScroll">
      <div class="page-wrap" id="pageWrap">
        <canvas id="pageCanvas"></canvas>
        <div class="textLayer" id="textLayer"></div>
        <div class="overlay" id="overlay"></div>
        <div class="overlay" id="pins"></div>
        <div id="captureMask"></div>
      </div>
      <div class="capbar hidden" id="capBar">
        <svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-frame-corners"></use></svg>
        Select area to capture <span class="x" id="capCancel">Cancel</span>
      </div>
    </div>
  </section>

  <!-- ===== Right notes ===== -->
  <aside id="notes">
    <div class="nt-top">
      <h2>Notes</h2>
      <div class="nt-tophdr">
        <button class="icon-btn" id="btnFilter" title="Filter & options"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-funnel"></use></svg></button>
        <button class="icon-btn" id="btnNotesSearch" title="Search notes"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-list-magnifying-glass"></use></svg></button>
        <button class="icon-btn" id="btnNotesMenu" title="More"><svg class="px-i" style="font-size:18px" aria-hidden="true"><use href="#i-dots-three-vertical"></use></svg></button>
        <button class="icon-btn collapse-tog" id="btnCollapseRight" title="Collapse notes"><svg class="px-i" style="font-size:17px" aria-hidden="true"><use href="#i-caret-double-right"></use></svg></button>
      </div>
    </div>
    <div class="nt-searchbar hidden" id="ntSearchbar">
      <svg class="px-i" style="font-size:16px" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>

    <div class="nt-list" id="notesList"></div>

      </div>
    </div>
  </aside>
